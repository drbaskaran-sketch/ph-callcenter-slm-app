# =====================================================================
# PRASHANTH HOSPITALS — NGINX REVERSE PROXY & SSL CONFIGURATION
# =====================================================================

# Rate Limiting Zone for API endpoints (10 requests per second per IP)
limit_req_zone $binary_remote_addr zone=ph_api_limit:10m rate=10r/s;

# HTTP Server — Redirect all unencrypted HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name callcenter-slm.prashanthhospitals.com _;

    # Certbot ACME challenge location for SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — Production SSL Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name callcenter-slm.prashanthhospitals.com;

    # SSL Certificate Paths (Let's Encrypt / Certbot or Self-Signed)
    ssl_certificate /etc/letsencrypt/live/callcenter-slm.prashanthhospitals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/callcenter-slm.prashanthhospitals.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Hardening Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Asset Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 1. Frontend Static Files (Vite React Production Build)
    root /home/ubuntu/ph-callcenter-slm-app/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (1 Year Cache)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Backend API Proxy (/api/* -> FastAPI Uvicorn Cluster on Port 8000)
    location /api/ {
        limit_req zone=ph_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket / Streaming Connection Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy Timeouts for Streaming Audio
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Call Audio Stream Buffer Location
    location /api/v1/recordings/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off; # Enable instant audio streaming
    }
}
