name: Continuous Integration & Resilience Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  resilience-and-exception-audit:
    name: Execute Automated Resilience & Endpoint Exception Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ph_db_user
          POSTGRES_PASSWORD: ph_secure_pass
          POSTGRES_DB: ph_callcenter_slm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ph_db_user -d ph_callcenter_slm_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🚀 Start FastAPI Backend Server in Background
        env:
          DATABASE_URL: postgresql+psycopg2://ph_db_user:ph_secure_pass@localhost:5432/ph_callcenter_slm_db
          PGPASSWORD: ph_secure_pass
        run: |
          # Export password for pg tools and psql
          export PGPASSWORD=ph_secure_pass

          echo "Waiting for Postgres..."
          for i in {1..60}; do
            if pg_isready -h localhost -p 5432 -U ph_db_user -d ph_callcenter_slm_db >/dev/null 2>&1; then
              echo "✅ Postgres is ready"
              break
            fi
            echo "Waiting for postgres... ($i/60)"
            sleep 1
          done
          if ! pg_isready -h localhost -p 5432 -U ph_db_user -d ph_callcenter_slm_db >/dev/null 2>&1; then
            echo "❌ Postgres did not become ready in time"
            # Attempt to dump postgres container logs to help debugging (best-effort)
            if command -v docker >/dev/null 2>&1; then
              docker ps --filter ancestor=postgres:16-alpine --format "{{.ID}} {{.Image}}" || true
              docker logs $(docker ps -q --filter ancestor=postgres:16-alpine) || true
            fi
            exit 1
          fi

          # Give a short extra moment for DB initialization scripts (/docker-entrypoint-initdb.d) to finish
          sleep 2

          # Start backend and capture logs to a file to help diagnosing startup/auth problems
          python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 >backend_uvicorn.log 2>&1 &
          echo "Waiting for FastAPI server to initialize on http://localhost:8000..."
          for i in {1..60}; do
            # Prefer a /health endpoint that returns 200; fallback: accept any HTTP response as "server up"
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$status" = "200" ]; then
              echo "✅ FastAPI Backend Server initialized and healthy!"
              break
            fi
            # if root responds with any code, consider server available (useful if / returns 401)
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "⚠️ FastAPI responded (non-200); continuing — check auth setup (status=$status)"
              break
            fi
            sleep 1
          done
          if ! curl -s http://localhost:8000/ > /dev/null; then
            echo "❌ Timed out waiting for FastAPI server startup."
            tail -n +1 backend_uvicorn.log || true
            exit 1
          fi

      - name: 🔊 Run Audio Stream & Error Resilience Stress Suite (test_audio_resilience_stress.py)
        run: |
          python test_audio_resilience_stress.py

      - name: 🧪 Run Complete Integration Test Matrix
        run: |
          python test_e2e_endpoints.py
          python test_ingestion_e2e.py
          python test_fcr_routing_load.py
          python test_branch_matrix_analytics.py
          python test_ui_form_validation_fcr.py
          python test_db_connection_pooling.py
          python test_environment_config.py
          python test_backend_dockerfile.py
          python test_frontend_dockerfile.py
          python test_docker_compose.py
          python test_nginx_ssl_config.py
          python test_user_management_stage3.py
          python test_analytics_drilldown_stage4.py
          python test_sla_governance_stage5.py
          python test_his_integrations_stage6.py
          python test_notifications_reports_stage7.py
          python test_qa_security_hardening_stage8.py

      - name: ✨ Report Pipeline Success
        run: |
          echo "=========================================================================="
          echo "✨ ALL CONTINUOUS INTEGRATION & RESILIENCE TESTS PASSED SUCCESSFULLY"
          echo "=========================================================================="
