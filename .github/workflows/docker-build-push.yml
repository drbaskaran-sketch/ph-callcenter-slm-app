name: Build and Push Production Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/ph-slm-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/ph-slm-frontend

jobs:
  build-and-push-containers:
    name: Build & Push Production Docker Images to Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build & Push FastAPI Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: 🏗️ Build & Push Vite React Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: ✨ Report Registry Push Success
        run: |
          echo "=========================================================================="
          echo "✨ PRODUCTION CONTAINER IMAGES SUCCESSFULLY BUILT AND PUSHED TO REGISTRY"
          echo "   • Backend Image: ${{ env.IMAGE_BACKEND }}:latest"
          echo "   • Frontend Image: ${{ env.IMAGE_FRONTEND }}:latest"
          echo "=========================================================================="
